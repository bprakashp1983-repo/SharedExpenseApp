workflows:

  ios-simulator-build:
    name: iOS Simulator Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Show project info
        script: |
          cd SharedExpense
          xcodebuild -list -project SharedExpense.xcodeproj

      - name: Build for iOS Simulator
        script: |
          cd SharedExpense
          xcodebuild build \
            -project SharedExpense.xcodeproj \
            -scheme SharedExpense \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CONFIGURATION_BUILD_DIR=$CM_BUILD_DIR/output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Zip the .app for download
        script: |
          cd $CM_BUILD_DIR/output
          zip -r SharedExpense-Simulator.zip SharedExpense.app

    artifacts:
      - $CM_BUILD_DIR/output/SharedExpense-Simulator.zip
      - $CM_BUILD_DIR/output/SharedExpense.app

  ios-device-build:
    name: iOS Device Build (requires Apple Developer account)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.example.SharedExpense

    scripts:
      - name: Build for iOS Device
        script: |
          cd SharedExpense
          xcodebuild archive \
            -project SharedExpense.xcodeproj \
            -scheme SharedExpense \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath $CM_BUILD_DIR/SharedExpense.xcarchive \
            -configuration Release

      - name: Export IPA
        script: |
          cat > /tmp/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/SharedExpense.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath $CM_BUILD_DIR/ipa

    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa
